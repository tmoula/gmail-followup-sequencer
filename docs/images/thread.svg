<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">What the recipient sees in Gmail</title>
  <desc id="d">The intro and follow-up appear as one conversation. When the recipient replies, the reply is detected and the remaining follow-ups are cancelled.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}.card{fill:#ffffff;stroke:#e1e4e8}.ink{fill:#1f2328}.muted{fill:#59636e}
    .av{fill:#0969da}.av2{fill:#8250df}.avT{fill:#ffffff}.reply{fill:#dafbe1;stroke:#1a7f37}.gT{fill:#116329}
    .ghost{fill:none;stroke:#d0d7de;stroke-dasharray:5 4}.chip{fill:#eef1f4}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.muted{fill:#9198a1}
      .reply{fill:#0f2a17;stroke:#3fb950}.gT{fill:#3fb950}.ghost{stroke:#30363d}.chip{fill:#21262d}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="719" height="419" rx="12"/>
  <text class="ink" x="24" y="42" font-size="20" font-weight="600">Quick question, Jonah</text>
  <rect class="chip" x="276" y="26" width="56" height="22" rx="4"/><text class="muted" x="285" y="41" font-size="12">Inbox</text>

  <!-- intro -->
  <rect class="card" x="16" y="64" width="688" height="84" rx="10"/>
  <circle class="av" cx="48" cy="92" r="16"/><text class="avT" x="48" y="97" font-size="13" font-weight="700" text-anchor="middle">Y</text>
  <text class="ink" x="76" y="90" font-size="14" font-weight="600">You</text><text class="muted" x="110" y="90" font-size="13">to Jonah</text>
  <text class="muted" x="688" y="90" font-size="12" text-anchor="end">Tue, Nov 17, 9:23 AM</text>
  <text class="ink" x="76" y="114" font-size="13">Hi Jonah, great meeting you last week. I'd love to hear how Fieldstone</text>
  <text class="ink" x="76" y="133" font-size="13">handles this today. Would you be open to a 20-minute call?</text>

  <!-- follow-up 1 -->
  <rect class="card" x="16" y="160" width="688" height="66" rx="10"/>
  <circle class="av" cx="48" cy="188" r="16"/><text class="avT" x="48" y="193" font-size="13" font-weight="700" text-anchor="middle">Y</text>
  <text class="ink" x="76" y="186" font-size="14" font-weight="600">You</text><text class="muted" x="110" y="186" font-size="13">to Jonah</text>
  <text class="muted" x="688" y="186" font-size="12" text-anchor="end">Fri, Nov 20, 10:47 AM</text>
  <text class="ink" x="76" y="210" font-size="13">Hi Jonah - following up on my note below. Would a quick call next week work?</text>

  <!-- reply -->
  <rect class="reply" x="16" y="238" width="688" height="92" rx="10" stroke-width="1.5"/>
  <circle class="av2" cx="48" cy="266" r="16"/><text class="avT" x="48" y="271" font-size="13" font-weight="700" text-anchor="middle">J</text>
  <text class="ink" x="76" y="264" font-size="14" font-weight="600">Jonah</text><text class="muted" x="124" y="264" font-size="13">to me</text>
  <text class="muted" x="688" y="264" font-size="12" text-anchor="end">Fri, Nov 20, 2:15 PM</text>
  <text class="ink" x="76" y="288" font-size="13">Hey! Sorry for the slow reply. Tuesday at 2 works for me.</text>
  <text class="gT" x="76" y="314" font-size="12.5" font-weight="700">✓ Reply detected: Status → Replied, remaining follow-ups cancelled</text>

  <!-- cancelled -->
  <rect class="ghost" x="16" y="344" width="688" height="56" rx="10"/>
  <text class="muted" x="40" y="377" font-size="13" text-decoration="line-through">Follow-up 2 · planned Tue, Nov 24, 9:02 AM</text>
  <text class="muted" x="688" y="377" font-size="12" text-anchor="end">never sent</text>
</svg>
