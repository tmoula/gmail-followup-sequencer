<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">Sheet Sequencer</title>
  <desc id="d">A Google Sheet row becomes an intro email, then follow-ups in the same Gmail thread, until the person replies and the sequence stops.</desc>
  <style>
    .bg{fill:#f6f8fa}.card{fill:#ffffff;stroke:#d0d7de}.ink{fill:#1f2328}.muted{fill:#59636e}
    .line{stroke:#8c959f}.dash{stroke:#c3c9d0}.accent{fill:#1a7f37}.accentS{stroke:#1a7f37}.blue{fill:#0969da}
    .stopbg{fill:#dafbe1;stroke:#1a7f37}.ghost{fill:#ffffff;stroke:#d0d7de;stroke-dasharray:4 4}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.muted{fill:#9198a1}
      .line{stroke:#6e7681}.dash{stroke:#30363d}.accent{fill:#3fb950}.accentS{stroke:#3fb950}.blue{fill:#4493f8}
      .stopbg{fill:#0f2a17;stroke:#3fb950}.ghost{fill:#161b22;stroke:#30363d}
    }
  </style>
  <rect class="bg" width="960" height="280" rx="16"/>

  <text class="ink" x="48" y="92" font-size="40" font-weight="700">Sheet Sequencer</text>
  <text class="muted" x="48" y="128" font-size="18">Gmail outreach with automatic follow-ups,</text>
  <text class="muted" x="48" y="152" font-size="18">run from a Google Sheet. Stops when they reply.</text>
  <text class="accent" x="48" y="200" font-size="15" font-weight="600">Free · open source · no server · your own Gmail</text>

  <!-- timeline -->
  <line class="line" x1="452" y1="140" x2="790" y2="140" stroke-width="2"/>
  <line class="dash" x1="790" y1="140" x2="900" y2="140" stroke-width="2" stroke-dasharray="5 5"/>

  <g>
    <rect class="card" x="404" y="70" width="96" height="44" rx="8"/>
    <text class="ink" x="452" y="90" font-size="13" font-weight="600" text-anchor="middle">Intro</text>
    <text class="muted" x="452" y="106" font-size="11" text-anchor="middle">Tue 9:23 am</text>
    <circle class="blue" cx="452" cy="140" r="7"/>
  </g>
  <g>
    <rect class="card" x="530" y="166" width="110" height="44" rx="8"/>
    <text class="ink" x="585" y="186" font-size="13" font-weight="600" text-anchor="middle">Follow-up 1</text>
    <text class="muted" x="585" y="202" font-size="11" text-anchor="middle">Fri 10:47 am</text>
    <circle class="blue" cx="585" cy="140" r="7"/>
    <text class="muted" x="585" y="232" font-size="11" text-anchor="middle">no reply yet</text>
  </g>
  <g>
    <rect class="stopbg" x="664" y="62" width="130" height="52" rx="8" stroke-width="1.5"/>
    <text class="accent" x="729" y="84" font-size="13" font-weight="700" text-anchor="middle">They replied ✓</text>
    <text class="accent" x="729" y="102" font-size="11" text-anchor="middle">sequence stops</text>
    <circle class="accent" cx="729" cy="140" r="8"/>
  </g>
  <g opacity="0.75">
    <rect class="ghost" x="812" y="166" width="104" height="44" rx="8"/>
    <text class="muted" x="864" y="186" font-size="13" text-anchor="middle" text-decoration="line-through">Follow-up 2</text>
    <text class="muted" x="864" y="202" font-size="11" text-anchor="middle">never sent</text>
    <circle class="ghost" cx="864" cy="140" r="6"/>
  </g>
</svg>
