<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="t d">
  <title id="t">The Sequencer menu</title>
  <desc id="d">The menu the script adds to Google Sheets: set up, schedule intros, send intros now, preview, pause, resume, run check now.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}.ink{fill:#1f2328}.muted{fill:#59636e}.sep{stroke:#e1e4e8}.hl{fill:#ddf4ff}.top{fill:#fff8c5}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.muted{fill:#9198a1}.sep{stroke:#30363d}.hl{fill:#0c2d6b}.top{fill:#3b2e0a}
    }
  </style>
  <rect class="top" x="8" y="6" width="104" height="26" rx="5"/>
  <text class="ink" x="20" y="24" font-size="14" font-weight="600">Sequencer ▾</text>
  <rect class="bg" x="8.5" y="38.5" width="420" height="254" rx="8"/>
  <g font-size="14">
    <text class="ink" x="28" y="68">Set up this sheet</text>
    <line class="sep" x1="9" y1="82" x2="428" y2="82"/>
    <rect class="hl" x="9" y="88" width="419" height="32"/>
    <text class="ink" x="28" y="109">Schedule intros for next weekday morning</text>
    <text class="ink" x="28" y="141">Send intros now</text>
    <text class="ink" x="28" y="173">Preview: send the first row's sequence to me</text>
    <line class="sep" x1="9" y1="188" x2="428" y2="188"/>
    <text class="ink" x="28" y="214">Pause all sending</text>
    <text class="ink" x="28" y="246">Resume sending</text>
    <text class="muted" x="28" y="278">Run check now</text>
  </g>
</svg>
